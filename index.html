<!DOCTYPE html>
<html>

<head>
	<title>Racer</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

	<style>
		body {
			background-color: #323232;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
		}

		h1 {
			background-color: #ab12e7;
			/* You can change this to any color you prefer */
			color: white;
			padding: 10px;
			border-radius: 15px;
		}

		.button {
			background-color: #6d1ea1;
			/* Green */
			border: none;
			color: white;
			padding: 15px 32px;
			text-align: center;
			text-decoration: none;
			display: inline-block;
			font-size: 16px;
			margin: 10px 2px;
			cursor: pointer;
			border-radius: 15px;
		}

		.button:disabled {
			background-color: #888;
			cursor: not-allowed;
		}

		input {
			margin-top: 10px;
			padding: 10px;
			font-size: 16px;
		}
	</style>









	<script>
		function checkInput() {
			var btcAddress = document.getElementById('btcAddress').value;
			document.getElementById('startButton').disabled = !btcAddress;
		}
		function sendData() {
			// Get the input data (btcAddress) from the input field
			const btcAddress = document.getElementById('btcAddress').value;
			const timestamp = Date.now();

			const data = {
				btcAddress: btcAddress,
				timestamp: timestamp
			};

			const sha256 = fetch('https://placeholder-uri.com/api', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(data)
			})
				.then(response => {
					if (response.ok) {
						console.log('Data sent successfully!');
					} else {
						console.log('Error sending data:', response.statusText);
					}
				})
				.catch(error => {
					console.error('Network error:', error);
				});
		}
	</script>
</head>

<body onload="checkInput()">

	<img class="image" src="images/dragonRacer.png" alt="Image description">

	<input type="text" id="btcAddress" placeholder="Enter btcAddress" oninput="checkInput()">

	<button class="button" id="startButton" onclick="location.href='racer.html', sendData()">Start</button>

	</div>

</body>

</html>
