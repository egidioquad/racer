<!DOCTYPE html>

<html>

<head>
	<title>Racer</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<link href="common.css" rel="stylesheet" type="text/css" />
</head>

<body>
	<div class="container">
		<div id="racer">
			<div id="hud">
				<span id="speed" class="hud"><span id="speed_value" class="value">0</span> mph</span>
				<span id="coins" class="hud">Coins <span id="coins_value" class="value">0</span></span>
				<span id="current_lap_time" class="hud">Time: <span id="current_lap_time_value"
						class="value">0.0</span></span>
				<span id="last_lap_time" class="hud">Last Lap: <span id="last_lap_time_value"
						class="value">0.0</span></span>
				<span id="fast_lap_time" class="hud">Fastest Lap: <span id="fast_lap_time_value"
						class="value">0.0</span></span>
			</div>
			
			<canvas id="canvas">
				Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
			</canvas>

			<audio id='music' muted='true' loop>
				<source src="music/racer.mp3">
			</audio>
			<span id="mute" onclick="Game.playMusic();" class=' on'></span>
			<button id="leaderboard-button">Show Leaderboard</button>
			<div id="leaderboard-container" style="display: none;"></div>
		</div>
	</div>


	<script src="common.js"></script>
	<script src="racer.js"></script>
	<script>
		racer();
	</script>
</body>

</html>
