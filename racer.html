<!DOCTYPE html>

<html>
    <head>
        <title>Dragon-Racer</title>

    <body>
        <div class="container">
            <div id="racer">
                <div id="hud">
                    <span id="speed" class="hud"
                        ><span id="speed_value" class="value">0</span> mph</span
                    >
                    <span id="coins" class="hud"
                        >Coins
                        <span id="coins_value" class="value">0</span></span
                    >
                    <span id="current_lap_time" class="hud"
                        >Time:
                        <span id="current_lap_time_value" class="value"
                            >0.0</span
                        ></span
                    >
                    <span id="last_lap_time" class="hud"
                        >Last Lap:
                        <span id="last_lap_time_value" class="value"
                            >0.0</span
                        ></span
                    >
                    <span id="fast_lap_time" class="hud"
                        >Fastest Lap:
                        <span id="fast_lap_time_value" class="value"
                            >0.0</span
                        ></span
                    >
                </div>

                <canvas id="canvas">
                    Sorry, this example cannot be run because your browser does
                    not support the &lt;canvas&gt; element
                </canvas>

                <audio id="music" muted="true" loop>
                    <source src="music/racer.mp3" />
                </audio>
                <span id="mute" onclick="playMusic();" class="on"></span>

                <button id="leaderboard-button">Show Leaderboard</button>

                <div id="leaderboard-container" style="display: none">
                    <div class="leaderboard-entry">
                        <span class="rank">#</span>
                        <span class="btc-address">Dragon-Racer Leaderboard</span>
                        <span class="score">Fastest Lap</span>
                    </div> 
                    <div class="line-separator"></div>
                </div>

            </div>

            <div id='gamepad'>
                <div class='left-buttons'>
                    <div id='gamepad-left' class='gamepad-button'><span><</span></div>
                    <div id='gamepad-right' class='gamepad-button'><span>></span></div>
                </div>
                <div class='right-buttons'>
                    <div id='gamepad-up' class='gamepad-button'><span>ʌ</span></div>
                    <div id='gamepad-down' class='gamepad-button'><span>v</span></div>
                </div>
            </div>
        </div>

            src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js"
        ></script>
		
		

        <script>
            function playMusic() {
                var music = document.getElementById("music");
                music.volume = 0.05; // shhhh! annoying music!
                music.muted = !music.muted;
            
                // Toggle the class on the "mute" element
                var muteElement = document.getElementById("mute");
                var muteClassName = "on";
                var isMuted = music.muted;
                var classes = muteElement.className.split(" ");
                var muteClassIndex = classes.indexOf(muteClassName);
            
                if (isMuted && muteClassIndex < 0) {
                    classes.push(muteClassName);
                } else if (!isMuted && muteClassIndex >= 0) {
                    classes.splice(muteClassIndex, 1);
                }
            
                muteElement.className = classes.join(" ");
            
                if (!music.muted) {
                    music.play();
                } else {
                    music.pause();
                }
            }
